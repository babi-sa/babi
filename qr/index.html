<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>ملصق الباب — بابي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Noto+Nastaliq+Urdu:wght@700&display=swap">
<link rel="icon" href="../t/icon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#2b3f5c;--sky:#3d5a80;--muted:#6b7280;--bg:#f6f7f9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tools button,.tools input{font-family:inherit;font-weight:900;font-size:15px;border-radius:999px;padding:10px 18px;border:1px solid #e5e7eb}
.tools input{direction:ltr;width:170px;background:#fff}
.tools button{background:var(--sky);color:#fff;border:0;cursor:pointer}
.hint{color:var(--muted);font-weight:700;font-size:13px;text-align:center}
/* الملصق: 10×14 سم */
.sticker{width:100mm;height:140mm;background:#fff;border:2px solid var(--ink);border-radius:8mm;padding:7mm 6mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.logo{display:flex;align-items:center;gap:2mm;font-weight:900;font-size:7mm}
.logo svg{width:9mm;height:9mm}
.t1{font-size:8.5mm;font-weight:900;line-height:1.2}
.t2{font-size:5mm;font-weight:900;direction:ltr;line-height:1.3}
.t3{font-family:"Noto Nastaliq Urdu",Cairo,serif;font-size:4.6mm;line-height:2}
#qr{padding:3mm;border:1.5mm solid var(--ink);border-radius:5mm;background:#fff}
#qr img,#qr canvas{display:block;width:52mm!important;height:52mm!important}
.url{direction:ltr;font-weight:900;font-size:4.6mm;color:var(--sky)}
@media screen and (max-width:440px){.sticker{zoom:.85}}
@media print{
  @page{size:auto;margin:10mm}
  body{background:#fff;padding:0}
  .tools,.hint{display:none}
  .sticker{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="tools">
  <input id="name" placeholder="client name" aria-label="اسم العميل">
  <button type="button" id="go">عرض</button>
  <button type="button" onclick="print()">طباعة</button>
</div>
<p class="hint">مقاس الملصق 10×14 سم. اطبعه بحجم 100% (بدون "ملاءمة للصفحة").</p>

<div class="sticker">
  <div class="logo"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#3d5a80"/><rect x="22" y="16" width="20" height="32" rx="2" fill="#fff"/><circle cx="37" cy="33" r="2" fill="#3d5a80"/></svg>بابي</div>
  <div>
    <div class="t1">مندوب التوصيل؟<br>امسح الكود</div>
    <div class="t2">Delivery? Scan for directions</div>
    <div class="t3" dir="rtl">ڈیلیوری؟ راستے کے لیے اسکین کریں</div>
  </div>
  <div id="qr"></div>
  <div class="url" id="url"></div>
</div>

<script>
function show(n) {
  n = (n || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
  var url = "https://babi-sa.com/" + (n ? n + "/" : "");
  document.getElementById("name").value = n;
  document.getElementById("url").textContent = url.replace("https://", "");
  var box = document.getElementById("qr"); box.innerHTML = "";
  new QRCode(box, { text: url, width: 600, height: 600, colorDark: "#2b3f5c", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  if (n) history.replaceState(null, "", "?n=" + n);
}
document.getElementById("go").onclick = function () { show(document.getElementById("name").value); };
document.getElementById("name").onkeydown = function (e) { if (e.key === "Enter") show(this.value); };
show(new URLSearchParams(location.search).get("n"));
</script>
</body>
</html>
